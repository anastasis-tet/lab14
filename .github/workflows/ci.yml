name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test Go collector
        working-directory: src/go-collector
        run: go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python pipeline
        working-directory: src/python-pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Test Python pipeline
        working-directory: src/python-pipeline
        run: pytest

