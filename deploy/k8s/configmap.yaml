apiVersion: v1
kind: ConfigMap
metadata:
  name: lab14-climate-config
data:
  EONET_BASE_URL: "https://eonet.gsfc.nasa.gov/api/v3"
  EONET_CATEGORIES: "wildfires,severeStorms,drought,seaLakeIce,dustHaze"
  EONET_DAYS: "365"
  EONET_STATUS: "all"
  COLLECTOR_HTTP_ADDR: ":8080"
  COLLECTOR_POLL_INTERVAL: "30s"
  WINDOW_SIZE: "24h"
  ETCD_ENDPOINTS: "http://etcd:2379"
  NATS_URL: "nats://nats:4222"
  NATS_SUBJECT: "climate.aggregates"

