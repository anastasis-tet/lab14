[project]
name = "climate-pipeline"
version = "0.1.0"
description = "NASA EONET climate change analysis pipeline for lab14"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "polars>=1.4.0",
  "duckdb>=1.0.0",
  "pyarrow>=17.0.0",
  "plotly>=5.23.0",
  "aiohttp>=3.10.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests/python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
